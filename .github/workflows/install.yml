name: Install test

# Runs the real installer on each OS, then checks the schedule fires, Firefox's files are in
# place and a headless Firefox opens the page. Then uninstalls and checks everything is gone.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly, to catch new Firefox or runner images breaking it

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Linux runners have no systemd user session by default; lingering starts one,
      # so the installer takes the same path it takes on a desktop.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 30); do XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done

      - name: Firefox on the runner
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   firefox --version; readlink -f "$(command -v firefox)" ;;
            macOS)   /Applications/Firefox.app/Contents/MacOS/firefox --version ;;
            Windows) "/c/Program Files/Mozilla Firefox/firefox.exe" --version | more || true ;;
          esac

      - name: Install
        run: python install.py --city London

      - name: Check the install
        run: python .github/ci/check.py installed

      - name: Uninstall
        run: python install.py --uninstall

      - name: Check the uninstall
        run: python .github/ci/check.py uninstalled

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startpage-${{ runner.os }}
          path: ${{ runner.temp }}/startpage.png
          if-no-files-found: ignore
