<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<!-- startpage: https://github.com/cybWasHere/startpage
     Settings live in config.js (links, weather, clock) and feeds.json (news); see the README. -->
<style>
  :root {
    --bg: #202326; --surface: #292c30; --line: #3b4045; --hover: #31363b;
    --text: #fcfcfc; --muted: #a1a9b1; --dim: #6c737a; --accent: #3daee9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(61,174,233,.13), transparent 70%),
      radial-gradient(800px 500px at 100% 110%, rgba(61,174,233,.06), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 15px/1.4 "Noto Sans", "Inter", system-ui, sans-serif;
    /* one screen, no scroll: header/links take what they need, news fills the rest */
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(12px, 2.6vh, 32px); padding: clamp(12px, 3.5vh, 44px) 16px clamp(12px, 3vh, 36px);
    height: 100vh; overflow: hidden;
  }
  header, #np, #links { flex: none; }
  header { text-align: center; user-select: none; }
  #clock {
    font-size: clamp(44px, min(11vw, 11vh), 132px); font-weight: 200; letter-spacing: -0.03em;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  #clock .sec { color: var(--dim); font-size: .38em; letter-spacing: 0; margin-left: .15em; }
  #date { margin-top: .6vh; color: var(--muted); font-size: 17px; letter-spacing: .02em; }
  /* weather widget: now card, week panel drops over the page on hover */
  #wx { position: relative; display: inline-block; margin-top: 1.2vh; z-index: 5; text-align: left; }
  #wx[hidden] { display: none; }
  #wx .now {
    display: flex; align-items: center; gap: 14px; padding: 8px 18px 8px 12px; border-radius: 16px; cursor: default;
    background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, background .15s;
  }
  #wx:hover .now { border-color: var(--accent); background: var(--hover); }
  #wx .now .wi { width: 44px; height: 44px; }
  #wx .temp { font-size: 30px; font-weight: 300; line-height: 1; }
  #wx .cond { font-size: 14px; font-weight: 600; text-transform: capitalize; }
  #wx .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  #wx .sub span + span::before { content: "·"; margin: 0 6px; color: var(--dim); }
  #wx .chev { width: 14px; height: 14px; stroke: var(--dim); fill: none; stroke-width: 2; transition: transform .2s; margin-left: 2px; }
  #wx:hover .chev { transform: rotate(180deg); stroke: var(--accent); }
  #wx .week {
    position: absolute; top: 100%; left: 50%; width: 400px; max-width: calc(100vw - 32px); padding-top: 8px;
    transform: translate(-50%, -6px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  #wx:hover .week { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #wx .panel {
    background: #1e2124; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
  }
  #wx .panel h3 { margin: 2px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
    display: flex; justify-content: space-between; }
  #wx .panel h3 span { letter-spacing: 0; text-transform: none; font-weight: 500; }
  #wx .day { display: grid; grid-template-columns: 52px 28px 40px 34px 1fr 34px; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  #wx .day + .day { border-top: 1px solid rgba(255,255,255,.05); }
  #wx .day .dn { font-weight: 600; }
  #wx .day .wi { width: 26px; height: 26px; }
  #wx .day .pp { font-size: 11px; color: #3daee9; }
  #wx .day .lo { color: var(--muted); text-align: right; }
  #wx .day .hi { font-weight: 600; }
  #wx .bar { position: relative; height: 5px; border-radius: 3px; background: var(--hover); }
  #wx .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #3daee9, #fdbc4b 60%, #f67400); background-size: var(--bw) 100%; background-position: var(--bx) 0; }
  .wi .spin { transform-origin: 50% 50%; animation: spin 24s linear infinite; }
  .wi .drop { animation: drop 1.3s linear infinite; }
  .wi .drop:nth-of-type(2) { animation-delay: -.45s; } .wi .drop:nth-of-type(3) { animation-delay: -.9s; }
  .wi .drift { animation: drift 6s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop { from { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(5px); opacity: 0; } }
  @keyframes drift { to { transform: translateX(2px); } }

  #np {
    display: none; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 18px 10px 10px; max-width: min(560px, 100%);
    transition: border-color .15s;
  }
  #np.on { display: flex; }
  #np:hover { border-color: var(--accent); }
  #np img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; background: var(--hover); }
  #np .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .txt { min-width: 0; }
  #np .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; margin-left: 6px; flex: none; }
  #np .eq i { width: 3px; background: var(--accent); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  #np .eq i:nth-child(2) { animation-delay: -.4s; } #np .eq i:nth-child(3) { animation-delay: -.7s; }
  #np.video img { width: 85px; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 14px; } }

  /* links: icon dock */
  #links { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 100%; }
  #links a {
    position: relative; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); text-decoration: none;
    font-weight: 700; font-size: 15px; transition: transform .15s, border-color .15s, background .15s;
  }
  #links a img { width: 22px; height: 22px; }
  #links a:hover, #links a:focus-visible { transform: translateY(-3px); border-color: var(--accent); background: var(--hover); outline: none; }
  #links a::after {
    content: attr(data-label); position: absolute; top: calc(100% + 8px); left: 50%; transform: translate(-50%, -4px);
    white-space: nowrap; font-size: 12px; font-weight: 500; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; opacity: 0; pointer-events: none;
    transition: opacity .12s, transform .12s; z-index: 2;
  }
  #links a:hover::after, #links a:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
  .key {
    position: absolute; right: -5px; bottom: -5px; font: 600 10px/1 "Hack", "JetBrains Mono", "DejaVu Sans Mono", monospace;
    color: var(--accent); background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px;
    opacity: 0; transition: opacity .12s;
  }
  #links a:hover .key, body.flash .key { opacity: 1; }

  /* news cards */
  #news { width: min(1180px, 100%); flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #news[hidden] { display: none; }
  #news { --tabc: var(--accent); }
  #news .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 clamp(8px, 1.6vh, 16px); flex: none; }
  #tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  #news h2 {
    margin: 0 10px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  }
  #tabs button {
    --c: var(--accent);
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font: 600 14px/1 inherit; font-family: inherit; color: var(--muted); letter-spacing: .01em;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 12px;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  #tabs button svg { width: 16px; height: 16px; stroke: var(--c); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #tabs button:hover { color: var(--text); border-color: var(--c); transform: translateY(-1px); }
  #tabs button.on {
    color: #fff; border-color: var(--c);
    background: color-mix(in srgb, var(--c) 26%, var(--surface));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), 0 6px 18px color-mix(in srgb, var(--c) 22%, transparent);
  }
  #tabs button.on svg { stroke: #fff; }
  #news .age { margin-left: auto; color: var(--dim); font-size: 11px; }
  /* rows share the leftover height; layoutCards() picks how many rows fit and hides the rest */
  #cards {
    flex: 1; min-height: 0; display: grid; gap: 14px; padding: 8px; margin: -8px; overflow: hidden;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); align-content: start;
  }
  #cards .card.cut { display: none; }
  @media (max-width: 720px) {
    #tabs { gap: 6px; }
    #tabs button { font-size: 13px; padding: 6px 11px 6px 9px; gap: 6px; }
    #news .age { display: none; }
  }
  .card {
    position: relative; min-height: 0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    animation: in .35s ease-out backwards;
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--tabc); outline: none;
    box-shadow: 0 4px 8px rgba(0,0,0,.35), 0 0 0 1px color-mix(in srgb, var(--tabc) 30%, transparent); }
  .card .pic { position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: linear-gradient(135deg, hsl(var(--h) 45% 32%), hsl(calc(var(--h) + 40) 45% 18%)); }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .card:hover .pic img { transform: scale(1.06); }
  .card .pic .fb { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700;
    color: rgba(255,255,255,.55); letter-spacing: .02em; }
  .card .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.45)); }
  .chip {
    position: absolute; left: 10px; top: 10px; z-index: 1; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; background: rgba(20,22,24,.72); backdrop-filter: blur(6px);
    color: var(--text); border: 1px solid rgba(255,255,255,.08);
  }
  .card .body { padding: 10px 13px 11px; display: flex; flex-direction: column; flex: none; }
  .card .h { font-weight: 600; font-size: 14px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
  .card:visited .h { color: var(--dim); }  /* already read */
  .card .m { margin-top: auto; padding-top: 6px; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .more {
    position: absolute; inset: 0; z-index: 2; padding: 14px 15px; display: flex; flex-direction: column; gap: 8px;
    background: #1e2124;
    opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .card:hover .more, .card:focus-visible .more { opacity: 1; transform: none; pointer-events: auto; }
  .more .h2 { font-weight: 600; font-size: 14px; line-height: 1.35; color: var(--text); }
  .more .d { color: var(--muted); font-size: 12.5px; line-height: 1.45; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .more .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--dim); }
  .more .tag { color: var(--tabc); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .more .go { color: var(--tabc); cursor: pointer; margin-left: auto; }
  .more .go:hover { text-decoration: underline; }
  /* lava lamp background (WebGL) and its on/off button */
  #lava { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: none; }
  body.lava #lava { display: block; }
  #lavaui { position: fixed; right: 14px; bottom: 14px; z-index: 6; }
  #lavaui[hidden] { display: none; }
  #lavabtn, #rainbtn {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0;
    background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--line);
    opacity: .45; transition: opacity .15s, border-color .15s, transform .15s;
  }
  #lavabtn:hover, #lavabtn:focus-visible, #lavaui.open #lavabtn, #rainbtn:hover, #rainbtn:focus-visible, #rainbtn.on {
    opacity: 1; border-color: var(--accent); outline: none; }
  #lavabtn:active, #rainbtn:active { transform: scale(.92); }
  #lavabtn svg, #rainbtn svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.8; transition: fill .6s; }
  /* rain button, left of the lamp: lit while it rains, with the volume as a ring around it */
  #rainbtn { position: fixed; right: 58px; bottom: 14px; z-index: 6; }
  #rainbtn[hidden] { display: none; }
  #rainbtn svg { stroke-linecap: round; stroke-linejoin: round; overflow: visible; transition: stroke .3s; }
  #rainbtn.on svg { stroke: var(--accent); }
  #rainbtn.on .drop { animation: fall 1.2s linear infinite; }
  #rainbtn.on .drop:nth-of-type(2) { animation-delay: -.4s; } #rainbtn.on .drop:nth-of-type(3) { animation-delay: -.8s; }
  #rainbtn.busy svg { animation: busy .7s ease-in-out infinite alternate; }
  #rainbtn::before {
    content: ""; position: absolute; inset: -1px; border-radius: 50%; padding: 2px; opacity: 0; transition: opacity .3s;
    background: conic-gradient(var(--accent) calc(var(--vol, .6) * 1turn), var(--line) 0);
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  #rainbtn.on::before { opacity: 1; }
  @keyframes fall { from { transform: translateY(-1.5px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(2.5px); opacity: 0; } }
  @keyframes busy { to { opacity: .35; } }
  body.lava #lavabtn svg { fill: var(--lamp, var(--accent)); stroke: color-mix(in srgb, var(--lamp, var(--accent)) 55%, #fff); }
  #lavamenu {
    position: absolute; right: 0; bottom: calc(100% + 8px); width: 216px; max-height: calc(100vh - 80px); overflow: auto;
    padding: 8px 6px 6px; background: #1e2124; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5); transform-origin: bottom right; animation: pop .16s ease-out;
  }
  #lavamenu[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.94); } }
  #lavamenu h3 { margin: 2px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #lavamenu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  #lavamenu button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px;
    background: none; color: var(--muted); font: 500 13px/1.2 inherit; font-family: inherit; text-align: left; cursor: pointer;
  }
  #lavamenu button:hover, #lavamenu button:focus-visible { background: var(--hover); color: var(--text); outline: none; }
  #lavamenu button[aria-checked="true"] { color: var(--text); font-weight: 600; }
  #lavamenu .sw { width: 20px; height: 20px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: transform .15s; }
  #lavamenu button:hover .sw { transform: scale(1.15); }
  #lavamenu .ck { margin-left: auto; width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  #lavamenu button[aria-checked="true"] .ck { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .card, .card *, #links a, #rainbtn .drop { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="lava" aria-hidden="true"></canvas>
<div id="lavaui" hidden>
  <div id="lavamenu" role="menu" aria-label="Background" hidden><h3>background</h3></div>
  <button id="lavabtn" title="Background" aria-label="Background" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 4c2.5 1.5 4 4 4 7a6 6 0 0 1-12 0c0-3 1.5-5.5 4-7z"/></svg>
  </button>
</div>
<button id="rainbtn" aria-label="Rain" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 14a3.5 3.5 0 0 1-.3-7 5 5 0 0 1 9.6 1.1A3 3 0 0 1 16.5 14z"/>
    <line class="drop" x1="8.5" y1="17" x2="7.5" y2="20"/><line class="drop" x1="12.5" y1="17" x2="11.5" y2="20"/><line class="drop" x1="16.5" y1="17" x2="15.5" y2="20"/></svg>
</button>
<header>
  <div id="clock"></div>
  <div id="date"></div>
  <div id="wx" hidden>
    <div class="now"></div>
    <div class="week"><div class="panel"></div></div>
  </div>
</header>

<a id="np" target="_self">
  <img alt="">
  <div class="txt"><div class="t"></div><div class="a"></div></div>
  <div class="eq"><i></i><i></i><i></i></div>
</a>

<main id="links"></main>

<section id="news" hidden>
  <div class="bar"><h2>news</h2><span id="tabs"></span><span class="age"></span></div>
  <div id="cards"></div>
</section>

<script src="config.example.js"></script>
<script src="config.js"></script><!-- yours; overrides the example when it exists -->
<script src="news.js"></script><!-- written by news.py -->

<script>
const CFG = window.STARTPAGE || {};
const WEATHER = CFG.weather, IMPERIAL = CFG.units === "imperial", LOCALE = CFG.locale || undefined;

const $ = s => document.querySelector(s);
const keys = {};

// links
const main = $("#links");
for (const [name, url, key] of CFG.links || []) {
  const a = document.createElement("a");
  a.href = url;
  a.dataset.label = name;
  a.setAttribute("aria-label", name);
  a.textContent = name[0];
  const img = new Image();
  img.alt = "";
  img.onload = () => { a.firstChild.replaceWith(img); };
  img.src = `https://icons.duckduckgo.com/ip3/${new URL(url).hostname}.ico`;
  if (key) { a.insertAdjacentHTML("beforeend", `<span class="key">${key}</span>`); keys[key] = url; }
  main.append(a);
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.altKey || e.metaKey || e.target.matches("input,textarea")) return;
  if (e.key === "?") { document.body.classList.toggle("flash"); return; }
  const url = keys[e.key.toLowerCase()];
  if (!url) { if (e.key.toLowerCase() === RAIN_KEYCAP && !rainBtn.hidden && !e.repeat) rainToggle(); return; }
  e.preventDefault();
  go(url, e.shiftKey);
});
// while this tab is the one raining, links open in a new tab, so leaving doesn't stop the rain
const go = (url, tab) => tab || rain.on ? window.open(url, "_blank") : (location.href = url);
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!rain.on || !a || e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  go(a.href);
});

// clock
const pad = n => String(n).padStart(2, "0");
function tick() {
  const d = new Date();
  const h = CFG.clock24 === false ? d.getHours() % 12 || 12 : pad(d.getHours());
  const small = [CFG.seconds === false ? "" : pad(d.getSeconds()), CFG.clock24 === false ? (d.getHours() < 12 ? "am" : "pm") : ""];
  $("#clock").innerHTML = `${h}:${pad(d.getMinutes())}<span class="sec">${small.filter(Boolean).join(" ")}</span>`;
  $("#date").textContent = d.toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });
}
tick(); setInterval(tick, 1000);

// weather (Open-Meteo, no key)
const WMO = { 0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "fog",
  51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 56: "freezing drizzle", 57: "freezing drizzle",
  61: "light rain", 63: "rain", 65: "heavy rain", 66: "freezing rain", 67: "freezing rain",
  71: "light snow", 73: "snow", 75: "heavy snow", 77: "snow grains",
  80: "showers", 81: "showers", 82: "violent showers", 85: "snow showers", 86: "snow showers",
  95: "thunderstorm", 96: "thunderstorm, hail", 99: "thunderstorm, hail" };
const SUN = '<g class="spin"><circle cx="24" cy="24" r="8" fill="#fdbc4b"/><g stroke="#fdbc4b" stroke-width="3" stroke-linecap="round">' +
  [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="24" y1="7" x2="24" y2="11" transform="rotate(${a} 24 24)"/>`).join("") + "</g></g>";
const MOON = '<path d="M30 8a14 14 0 1 0 10 22A11 11 0 0 1 30 8z" fill="#c8d0e0"/>';

// the one line worth reading before going out: "rain at 17:00", "wet until 19:00", "dry until Sat"

  const i = t.findIndex((x, k) => k >= now && wet(k) !== wet(now));  // the next change, either way
  if (i < 0) return wet(now) ? "wet all week" : "dry all week";
  const day = d.time.indexOf(t[i].slice(0, 10));

  const soon = !day || i - now < 12, at = t[i].slice(11, 16);  // today or within 12 h, the hour says it all
  if (wet(now)) return `wet until ${soon ? "" : name + " "}${at}`;

      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,cloud_cover_mean` +

      `<span>feels ${r(c.apparent_temperature)}°</span><span>${nextRain(w)}</span></div></div>` +

// rain: a four-minute loop of steady rain, with distant thunder rolling over it at random, so the
// thunder never repeats. Web Audio rather than an <audio> element on purpose: the loop point is
// sample-exact, and the browser doesn't list it as a media player, so the play/pause key and "now
// playing" widgets keep following your music. rain.js (the recordings, as data: URLs) is only

      const ctx = rain.ctx || (rain.ctx = new AudioContext());  // made inside the click, so it is allowed to sound
      if (!window.RAIN) await new Promise((ok, no) => { const s = el("script"); s.src = "rain.js"; s.onload = ok; s.onerror = no; document.head.append(s); });

      rain.gain = gain;

        Promise.all(RAIN.thunder.map(sound)).then(rolls => { rain.thunder = rolls; rainThunder(); }, e => console.warn("thunder:", e));

  }

  rainThunder();
}
// a roll every 5 to 43 s, mostly sooner; never the same one twice running, each at its own
// distance, pitch and side, so ten recordings make a storm that doesn't come round again
function rainThunder() {
  clearTimeout(rain.timer);
  if (!rain.on || !rain.thunder.length) return;
  rain.timer = setTimeout(() => {
    if (!rain.on) return;
    let i; do i = Math.floor(Math.random() * rain.thunder.length); while (i === rain.last && rain.thunder.length > 1);
    rain.last = i;
    const ctx = rain.ctx, src = ctx.createBufferSource(), far = ctx.createGain(), side = ctx.createStereoPanner();
    src.buffer = rain.thunder[i];
    src.playbackRate.value = 0.88 + 0.2 * Math.random();
    far.gain.value = 10 ** ((-9 + 11 * Math.random()) / 20);
    side.pan.value = Math.random() - 0.5;
    src.connect(far).connect(side).connect(rain.gain);
    src.start();
    rainThunder();
  }, (5 + 38 * Math.random() ** 1.7) * 1000);
}
function rainStop() {
  rain.on = false; rainShow();
  RAIN_CH?.postMessage({ on: false });
  clearTimeout(rain.timer);
  if (!rain.gain) return;
  rainFade(0.6);
  setTimeout(() => rain.on || rain.ctx.suspend(), 1500);  // silent by now: stop spending CPU on it
}
function rainToggle() {
  if (rain.away) { RAIN_CH.postMessage({ stop: true }); rain.away = false; rainShow(); }  // it rains in another tab: stop it there
  else if (rain.on) rainStop();
  else rainStart();
}
if (RAIN_CH) RAIN_CH.onmessage = ({ data: m }) => {
  if (m.hello) { if (rain.on) RAIN_CH.postMessage({ on: true, vol: rain.vol }); return; }
  if (m.stop) { if (rain.on) rainStop(); return; }
  if (m.vol != null) { rain.vol = m.vol; if (rain.gain) rainFade(0.2); }
  if (m.on != null && !rain.on) rain.away = m.on;
  rainShow();
};
rainBtn.onclick = rainToggle;
rainBtn.addEventListener("wheel", e => {
  e.preventDefault();
  const step = -e.deltaY * (e.deltaMode ? 1 / 60 : 1 / 2000);  // one wheel notch is 5%
  rain.vol = Math.round(Math.min(1, Math.max(0.05, rain.vol + step)) * 100) / 100;
  try { localStorage.setItem(RAIN_KEY, rain.vol); } catch {}
  if (rain.gain) rainFade(0.2);
  RAIN_CH?.postMessage({ vol: rain.vol });
  rainShow();
}, { passive: false });
addEventListener("pagehide", () => { if (rain.on) { rainStop(); rain.ctx?.suspend(); } });
{
  let saved = NaN; try { saved = parseFloat(localStorage.getItem(RAIN_KEY)); } catch {}
  if (saved >= 0.05 && saved <= 1) rain.vol = saved;
  if (!keys[RAIN_KEYCAP]) rainBtn.insertAdjacentHTML("beforeend", `<span class="key">${RAIN_KEYCAP}</span>`);
  rainBtn.hidden = CFG.rain === false;
  rainShow();
  RAIN_CH?.postMessage({ hello: true });
}

// news
const TAB_KEY = "startpage.newsTab";
// tab colour (Breeze palette) + 24px stroke icon; tabs missing here get the accent and a dot
const TAB_META = {
  france:      ["#3daee9", '<path d="M5 21V4h11l-2 4 2 4H5"/>'],
  world:       ["#27ae60", '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'],
  tech:        ["#1abc9c", '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>'],
  games:       ["#f67400", '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="15.5" cy="12" r=".6"/><circle cx="18" cy="14" r=".6"/>'],
  ai:          ["#9b59b6", '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>'],
  geopolitics: ["#da4453", '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>'],
  linux:       ["#fdbc4b", '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/>'],
  science:     ["#2ecc71", '<path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3M7 15h10"/>'],
  music:       ["#e93a9a", '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'],
};
function ago(t) {
  const m = Math.round((Date.now() / 1000 - t) / 60);
  return !t ? "" : m < 60 ? `${Math.max(m, 1)} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`;
}
const hue = str => [...str].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
function card(it, i) {
  const a = el("a", "card");
  a.href = it.url;
  a.style.animationDelay = `${i * 35}ms`;
  const pic = el("div", "pic");
  pic.style.setProperty("--h", hue(it.site || it.src));
  const fallback = () => { pic.querySelector("img")?.remove(); pic.append(el("div", "fb", it.site || it.src)); };
  if (it.img) {
    const img = new Image();
    img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.onerror = fallback;
    img.src = it.img;
    pic.append(img);
  } else fallback();
  pic.append(el("span", "chip", it.src));
  const body = el("div", "body");
  body.append(el("div", "h", it.title), el("div", "m", [it.site, it.stats || ago(it.t)].filter(Boolean).join(" · ")));
  const more = el("div", "more");
  more.append(el("div", "h2", it.title));
  if (it.desc) more.append(el("div", "d", it.desc));
  const foot = el("div", "foot");
  const who = [it.src, it.site, it.author, it.stats, ago(it.t) && `${ago(it.t)} ago`].filter(Boolean).join(" · ");
  foot.append(el("span", "", who));
  for (const t of it.tags || []) foot.append(el("span", "tag", t));
  if (it.comments) {
    const link = el("span", "go", "comments →");
    link.onclick = e => { e.preventDefault(); e.stopPropagation(); go(it.comments); };
    foot.append(link);
  }
  more.append(foot);
  a.append(pic, body, more);
  return a;
}
// show only whole cards: as many rows of >= CARD_MIN px as the leftover height allows
const CARD_MIN = 185, GAP = 14;
function layoutCards() {
  const g = $("#cards"), cards = [...g.children];
  if (!cards.length) return;
  const cols = getComputedStyle(g).gridTemplateColumns.split(" ").length;
  const h = g.clientHeight - 16;
  const rows = Math.max(1, Math.min(Math.ceil(cards.length / cols), Math.floor((h + GAP) / (CARD_MIN + GAP))));
  g.style.setProperty("--rows", rows);
  cards.forEach((c, i) => c.classList.toggle("cut", i >= cols * rows));
}
new ResizeObserver(layoutCards).observe(document.querySelector("#cards"));
function showNews(tab) {
  const N = window.NEWS;
  if (!N?.tabs?.[tab]) return;
  try { localStorage.setItem(TAB_KEY, tab); } catch {}
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  $("#news").style.setProperty("--tabc", TAB_META[tab]?.[0] || "var(--accent)");
  $("#cards").replaceChildren(...N.tabs[tab].map(card));
  layoutCards();
  $("#news .age").textContent = `updated ${ago(N.updated)} ago`;
}
if (window.NEWS?.tabs) {
  const tabs = Object.keys(NEWS.tabs).filter(k => NEWS.tabs[k].length);
  for (const k of tabs) {
    const b = document.createElement("button");
    const [c, icon] = TAB_META[k] || ["", '<circle cx="12" cy="12" r="4"/>'];
    b.dataset.tab = k;
    if (c) b.style.setProperty("--c", c);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span></span>`;
    b.children[1].textContent = k;
    b.onclick = () => showNews(k);
    $("#tabs").append(b);
  }
  let saved = null; try { saved = localStorage.getItem(TAB_KEY); } catch {}
  showNews(tabs.includes(saved) ? saved : tabs[0]);
  $("#news").hidden = false;
}
